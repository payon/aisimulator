services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiplatform}
      POSTGRES_DB: ${POSTGRES_DB:-aiplatform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 외부 직접 접속 차단 (앱 컨테이너·로컬에서만 접속)
      - "127.0.0.1:${PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiplatform} -d ${POSTGRES_DB:-aiplatform}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      # 도메인(CloudPanel nginx → 127.0.0.1:3300)으로만 서비스, 외부 직접 접속 차단
      - "127.0.0.1:${APP_PORT:-3300}:3300"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3300/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiplatform}:${POSTGRES_PASSWORD:-aiplatform}@db:5432/${POSTGRES_DB:-aiplatform}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://rustkorea.cloud}
      API_KEY_SECRET: ${API_KEY_SECRET:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@aiplatform.kr}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      DEFAULT_AI_PROVIDER: ${DEFAULT_AI_PROVIDER:-zai-built-in}
    volumes:
      - uploads:/app/public/uploads

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiplatform}
      POSTGRES_DB: ${POSTGRES_DB:-aiplatform}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - backups:/backups
    command: ["sh", "-c", "chmod +x /backup.sh; while true; do /backup.sh || true; sleep 86400; done"]

volumes:
  pgdata:
  uploads:
  backups:
