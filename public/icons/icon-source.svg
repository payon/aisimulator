<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- 배경 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 외부 글로우 -->
  <circle cx="256" cy="240" r="140" fill="none" stroke="url(#glow)" stroke-width="2" opacity="0.3"/>
  <circle cx="256" cy="240" r="120" fill="none" stroke="url(#glow)" stroke-width="1.5" opacity="0.2"/>
  <!-- 메인 별/스파클 -->
  <g transform="translate(256,230)">
    <!-- 중심 빔 -->
    <path d="M0,-90 C8,-30 30,-8 90,0 C30,8 8,30 0,90 C-8,30 -30,8 -90,0 C-30,-8 -8,-30 0,-90Z" fill="url(#sparkle)"/>
    <!-- 대각 빔 -->
    <path d="M0,-55 C4,-18 18,-4 55,0 C18,4 4,18 0,55 C-4,18 -18,4 -55,0 C-18,-4 -4,-18 0,-55Z" fill="url(#sparkle)" opacity="0.7" transform="rotate(45)"/>
    <!-- 중심 점 -->
    <circle cx="0" cy="0" r="18" fill="#fef3c7"/>
    <circle cx="0" cy="0" r="10" fill="#fbbf24"/>
  </g>
  <!-- AI 텍스트 -->
  <text x="256" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="800" fill="#f8fafc" letter-spacing="-2">AI</text>
  <!-- 플랫폼 텍스트 -->
  <text x="256" y="468" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" fill="#94a3b8" letter-spacing="6">PLATFORM</text>
</svg>
